name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The same build SAUR runs: makepkg inside packaging/arch, clean Arch, unprivileged user.
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git go zsh fzf zoxide
      - uses: actions/checkout@v4
      - name: Build the package
        run: |
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && go test ./... && bash tests/test-pkgbuild.sh /tmp/pkg"
      - name: Install and smoke-test
        run: |
          pacman -U --noconfirm /tmp/pkg/modern-shell-*.pkg.tar.zst
          msh --version
          zsh -c 'autoload -Uz compinit && compinit -u && whence -v _msh'

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: nix flake check
        run: nix flake check -L
      - name: nix build
        run: nix build -L
      - name: nix run
        run: |
          nix run . -- --version
          test -x result/bin/msh-setup
          test -f result/share/zsh/site-functions/_msh
