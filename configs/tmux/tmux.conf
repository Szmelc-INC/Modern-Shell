# Modern Shell — tmux configuration (installed as ~/.tmux.conf)
# Prefix: Ctrl+A (Ctrl+B still works). Reload: prefix + r. Help: prefix + ?

# ── Core ──────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"          # true color
set -g default-shell "${SHELL}"
set -g mouse on
set -g history-limit 50000
set -g escape-time 10                       # snappy Esc in editors
set -g focus-events on
set -g set-clipboard on                     # OSC 52 clipboard
set -g base-index 1                         # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S · #W"
setw -g mode-keys vi
set -g status-keys emacs
set -g display-time 2000

# ── Prefix ────────────────────────────────────────────────────────────────
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix

# ── Keys ──────────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind | split-window -h -c "#{pane_current_path}"   # split side by side
bind - split-window -v -c "#{pane_current_path}"   # split top/bottom
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -n M-Left  select-pane -L                     # Alt+arrows: move between panes
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n S-Left  previous-window                    # Shift+arrows: windows
bind -n S-Right next-window
bind S setw synchronize-panes \; display "sync #{?synchronize-panes,ON,OFF}"
bind x kill-pane
bind m display-popup -E -w 90% -h 90% "msh"        # Modern Shell TUI in a popup
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Look (Midnight palette) ──────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 30
set -g status-right-length 60
set -g status-left "#[bg=#7aa2f7,fg=#1e1e2e,bold] #S #[bg=#1e1e2e] "
set -g status-right "#{?client_prefix,#[fg=#f9e2af]● PREFIX ,}#{?pane_synchronized,#[fg=#f38ba8]SYNC ,}#[fg=#6c7086]%H:%M #[bg=#313244,fg=#b4befe] #h "
setw -g window-status-format "#[fg=#6c7086] #I #W "
setw -g window-status-current-format "#[bg=#232339,fg=#b4befe,bold] #I #W#{?window_zoomed_flag, 󰊓,} "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#232339,fg=#b4befe"
setw -g mode-style "bg=#b4befe,fg=#1e1e2e"
set -g popup-border-style "fg=#7aa2f7"
set -g popup-border-lines rounded

# ── Local overrides ───────────────────────────────────────────────────────
if-shell "test -f ~/.config/tmux/local.conf" "source-file ~/.config/tmux/local.conf"
